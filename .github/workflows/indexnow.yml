name: IndexNow
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit recently changed sitemap URLs to IndexNow
        env:
          WINDOW_HOURS: ${{ github.event_name == 'schedule' && '25' || '2' }}
        run: |
          since="$(date -u -d "${WINDOW_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Submitting URLs with lastmod after ${since}"
          node scripts/submit-indexnow.mjs --since "${since}"
